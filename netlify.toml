[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  CI = "false"
  NPM_FLAGS = "--legacy-peer-deps"


# Academia: visible (header link, sitemap, indexing) only on the develop
# branch deploy. In production it is reachable by direct URL only.
[context.develop.environment]
  NEXT_PUBLIC_ACADEMY_PUBLIC = "true"
