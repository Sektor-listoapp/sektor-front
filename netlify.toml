[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  CI = "false"
  NPM_FLAGS = "--legacy-peer-deps"
  # Academia launched: header link, sitemap and indexing on every deploy.
  NEXT_PUBLIC_ACADEMY_PUBLIC = "true"
